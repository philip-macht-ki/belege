name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Die plattformneutralen Regressionstests laufen auf macOS; Windows prüft
      # die dort eigenen Scheduler-, Dialog- und Pfadzweige gezielt.
      - run: uv run pytest -q ${{ matrix.os == 'windows-latest' && 'tests/test_windows.py' || '' }}
