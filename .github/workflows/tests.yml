name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tests: tests/test_zeitplan.py tests/test_anmelden.py tests/test_einrichten.py tests/test_windows.py
          - os: windows-latest
            tests: tests/test_windows.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q ${{ matrix.tests }}
