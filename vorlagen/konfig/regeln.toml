# Feste Regeln. Sie gelten vor jedem Modellurteil. Erste passende gewinnt.

# Absender, deren Anhänge nie Belege sind (Newsletter, Infobriefe).
ausschluss = []

# [[absender]]
# muster = "@pixelwerk.example"   # Teil der Absenderadresse, des Anzeigenamens oder des Dateinamens
# lieferant = "Pixelwerk"
# bereich = "betrieb"             # optional: betrieb | privat
# art = "eingang"                 # optional: eingang | ausgang | sonstige
# beschreibung = "Software-Abo"   # optional

[zahlungsabwickler]
# Bei diesen Absendern steht der eigentliche Anbieter im Anzeigenamen.
domains = ["stripe.com", "paypal.com", "paypal.de", "paddle.com", "lemonsqueezy.com", "fastspring.com", "gumroad.com"]

[monat]
# Buchungen, zu denen es keinen Beleg gibt.
ohne_beleg = ["Finanzamt", "Gehalt", "Lohn", "Umbuchung", "Privatentnahme", "Sparen", "Tilgung"]
aliase = { "Pixelwerk" = ["PXW", "Pixelwerk Software"] }
lohn = ["Gehalt", "Lohn"]
abgaben = ["Finanzamt", "Krankenkasse", "AOK", "Berufsgenossenschaft", "Gemeinde", "Stadtkasse"]
bank = ["Kontoführung", "Entgelt", "Zinsen"]
abschlag = ["Abschlag"]

# Weiche „vertraulich“ (Arzt, Gericht, Personal, Mandanten): Solche Belege und
# Dokumente liest nur dein Mac, kein Cloud-Modell. Feste Wörter sind eingebaut.
# [vertraulich]
# absender = ["@labor-beispiel.de"]   # Teil der Absenderadresse
# woerter_stark = ["PraxisSoft"]      # ein Treffer genügt
# woerter = []                        # zählen erst zu zweit
# aus = false
