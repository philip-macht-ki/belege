# Deine Einstellungen. Dein Claude trägt sie mit dir ein (einrichten.md).
zeitzone = "Europe/Berlin"

[betrieb]
# So heißt dein Betrieb auf Rechnungen. Alle Schreibweisen, unter denen
# Rechnungen an dich kommen, gehören in `namen`.
name = "Studio Beispiel"
namen = ["Studio Beispiel", "Mara Beispiel"]
taetigkeit = "Grafikdesign"
ust_id = ""

[rechner]
# Nur dieser Rechner legt ab und sendet, also dein Dauerrechner. Den Namen zeigt
# `hostname -s`. Leer heißt: jeder Rechner. Trag ihn ein, bevor du den Zeitplan
# einschaltest. Auf jedem anderen Rechner brechen Läufe dann sofort ab.
erlaubt = ""

[ablage]
# Teil 1 arbeitet nur in ~/Belege. Cloud-Ordner kommen erst in Teil 3 dazu.
ordner = "~/Belege"
bereich_betrieb = "Betrieb"
bereich_privat = "Privat"
privat = true

# Ein Block je Postfach. Das erste wird nach Belegen durchsucht.
# weg = "a" (App-Passwort im Schlüsselbund, Standard) | "b" (eigenes Google-Projekt) | "ordner" (Musterpostfach)
[[konto]]
name = "geschaeft"
weg = "ordner"
adresse = "mara@studio-beispiel.example"
ordner = "beispiel/erzeugt/postfach"
imap_server = ""
smtp_server = ""
belege = true
waechter = true

[postfach]
erste_tage = 30
laufend_tage = 3
# Rückblick ab dem letzten erledigten Lauf, höchstens so viele Tage (MacBook zu, Urlaub)
max_tage = 60
label = "Beleg"

[quellen]
handy_ordner = "~/Belege/Eingang"
# Bekommst du Briefe auf Papier? Ein Scan-Dienst (z.B. Dropscan, Caya) oder eine
# Scan-App legt PDFs in einen Cloud-Ordner. Trag ihn hier ein, dann behandelt
# belege ihn wie den Handy-Eingang. Leer = keine Papierpost.
scan_ordner = ""
downloads = "~/Downloads"
downloads_an = true
# Rechnungen, die nur als Link in einer Mail stehen (kein PDF-Anhang): belege
# holt sie, wenn die Mail nach Rechnung aussieht und genau einen PDF-Link hat.
# Nur öffentliche https-Links, nur echte PDFs. false = ausschalten.
rechnungslinks = true
rechnungslink_max_mb = 15

[texterkennung]
claude = true

[senden]
# Nur an diese Adressen darf automatisch gesendet werden. An alle anderen
# entsteht ein Entwurf, den du selbst abschickst.
erlaubt = []

[bericht]
# Leer = die Adresse des ersten Postfachs.
an = ""
leer_senden = false

[uebergabe]
# "mail" an eine Adresse (Steuerberater, DATEV Upload Mail, Lexware Office,
# sevDesk) oder "ordner" (ein freigegebener Ordner).
weg = "mail"
adresse = ""
ordner = ""
tag = 3
nur_pdf_tif = false
max_mb = 20
max_anhaenge = 50

[monat]
# Hier legst du die Kontoauszüge als CSV ab, ein Monat je Datei.
auszuege = "~/Belege/Kontoauszuege"

[takt]
minuten = 15
tag_uhrzeit = "21:00"
# Adresse deines Lebenszeichens (vom Kurs-Connector, Werkzeug lebenszeichen).
# Nach jedem fehlerfreien Takt meldet sich belege dort. Leer = aus.
lebenszeichen = ""

[update]
# Sonntags nach Verbesserungen schauen. Nur Updates ohne eigenen Schritt werden eingespielt.
automatisch = true
# Ohne Plus kommen automatische Updates vier Wochen ab Einrichtung, danach nur
# Sicherheitsupdates; von Hand geht es immer. Name des Zusatzpakets im Hinweis:
# plus_name = "Kassensturz"
# plus_link = "https://philipkleudgen.de/mitglieder/monatszahlen"

[urteil]
# claude = Claude-Abo (Standard) | codex = ChatGPT-Abo über Codex |
# lokal = Ollama nur auf diesem Mac | anthropic = Anthropic-API | ohne = nur Regeln
backend = "claude"
modell = "sonnet"
# modell_codex = "gpt-5.1-codex"
# modell_lokal = "qwen3:14b"

[dokumente]
# Verträge, Versicherungen und Briefe, die kein Beleg sind (Modul bh8).
eingang = "~/Belege/Dokumente-Eingang"
ordner = "Dokumente"
erinnern_tage = 28
