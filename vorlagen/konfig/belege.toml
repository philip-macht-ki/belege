# Deine Einstellungen. Dein Claude trägt sie mit dir ein (einrichten.md).
zeitzone = "Europe/Berlin"

[betrieb]
# So heißt dein Betrieb auf Rechnungen. Alle Schreibweisen, unter denen
# Rechnungen an dich kommen, gehören in `namen`.
name = "Studio Beispiel"
namen = ["Studio Beispiel", "Mara Beispiel"]
taetigkeit = "Grafikdesign"
ust_id = ""

# Mehrere Firmen: Statt [betrieb] kannst du je Firma einen solchen Block
# eintragen. [betrieb] bleibt für bestehende Einrichtungen gültig.
# [[firma]]
# name = "Beispiel Holding GmbH"
# namen = ["Beispiel Holding GmbH", "Beispiel Holding"]
# ust_id = "DE123456789"
# Für Firmen außerhalb Deutschlands: Pflichtangaben-Prüfung für diese Firma ausschalten.
# pruefung = false
# Optional: Anschrift auf Rechnungen prüfen (Straße mit Hausnummer, PLZ und Ort).
# anschrift = { strasse = "Musterstraße 1", plz = "12345", ort = "Berlin" }
# bereich = "Holding"
# Konten aus dem Auszug: IBAN oder Kontokennung (bei MoneyMoney aus dessen Export).
# Buchungen ohne zugeordnetes Konto gehören zur ersten Firma.
# konten = ["DE12 3456 7890 1234 5678 90"]
# uebergabe = "holding@steuerkanzlei.example"
#
# [[firma]]
# name = "Beispiel Service GmbH"
# namen = ["Beispiel Service GmbH", "Beispiel Service"]
# ust_id = "DE987654321"
# bereich = "Service"
# konten = ["DE98 7654 3210 9876 5432 10"]

[rechner]
# Nur dieser Rechner legt ab und sendet, also dein Dauerrechner. Den Namen zeigt
# `hostname -s`. Leer heißt: jeder Rechner. Trag ihn ein, bevor du den Zeitplan
# einschaltest. Auf jedem anderen Rechner brechen Läufe dann sofort ab.
erlaubt = ""

[ablage]
# Teil 1 arbeitet nur in ~/Belege. Cloud-Ordner kommen erst in Teil 3 dazu.
ordner = "~/Belege"
bereich_betrieb = "Betrieb"
bereich_privat = "Privat"
privat = true

# Ein Block je Postfach. Das erste wird nach Belegen durchsucht.
# weg = "a" (App-Passwort im Schlüsselbund, Standard) | "b" (eigenes Google-Projekt) | "ordner" (Musterpostfach)
[[konto]]
name = "geschaeft"
weg = "ordner"
adresse = "mara@studio-beispiel.example"
ordner = "beispiel/erzeugt/postfach"
imap_server = ""
smtp_server = ""
# Gesucht wird in allen Ordnern außer Gesendet, Papierkorb, Spam, Entwürfen.
# Enger: Weg A nur Posteingang + diese Ordner, Microsoft nur der Posteingang.
# imap_ordner = ["INBOX/Rechnungen"]
# nur_posteingang = true
belege = true
waechter = true
aufraeumen = false
# Nach erfolgreicher echter Ablage: "aus" (Standard), "markieren" oder "verschieben".
# IMAP verschiebt nur, wenn der Server MOVE kann; sonst bleibt die Mail markiert.
nach_ablage = "aus"
nach_ablage_ordner = "Belege erledigt"

[postfach]
erste_tage = 30
laufend_tage = 3
# Rückblick ab dem letzten erledigten Lauf, höchstens so viele Tage (MacBook zu, Urlaub)
max_tage = 60
label = "Beleg"

[aufraeumen]
# Postfach-Agent: räumt den Posteingang nach konfig/postfach-regeln.md auf. Ab Werk aus.
an = false
zeiten = ["07:30", "17:30"]
# "kopf" liest nur Absender und Betreff; "text" darf zusätzlich im Mailtext suchen.
lesen = "kopf"
erste_tage = 7
max_je_lauf = 200
# So viele Tage prüft der Agent erledigte Mails noch einmal zum Archivieren.
erledigt_tage = 90
# So viele der neuesten Posteingangsmails prüft der Erledigt-Durchlauf je Lauf.
erledigt_max = 1000
# Dieses Label, diese Kategorie oder dieses Keyword bedeutet für dich: erledigt.
erledigt_markierung = "Erledigt"
# "lokal": Mailtexte verlassen deinen Mac nie (Ollama nötig).
modell = "eingestellt"
# false: Bericht und Mitteilungen nennen nur Absenderdomain und Aktion.
betreffe_im_bericht = true

[quellen]
handy_ordner = "~/Belege/Eingang"
# Bekommst du Briefe auf Papier? Ein Scan-Dienst (z.B. Dropscan, Caya) oder eine
# Scan-App legt PDFs in einen Cloud-Ordner. Trag ihn hier ein, dann behandelt
# belege ihn wie den Handy-Eingang, Unterordner (z.B. je Scanbox und Tag) zählen
# mit. Die Originale bleiben dort liegen. Leer = keine Papierpost.
scan_ordner = ""
downloads = "~/Downloads"
# Ab Werk aus: Downloads kommen erst in Teil 3 dran. Bis dahin liest kein Lauf,
# auch nicht der Musterlauf, den echten Downloads-Ordner.
downloads_an = false
# Rechnungen, die nur als Link in einer Mail stehen (kein PDF-Anhang): belege
# holt sie, wenn die Mail nach Rechnung aussieht und genau einen PDF-Link hat.
# Nur öffentliche https-Links, nur echte PDFs. false = ausschalten.
rechnungslinks = true
rechnungslink_max_mb = 15

[texterkennung]
claude = true

[senden]
# Nur an diese Adressen darf automatisch gesendet werden. An alle anderen
# entsteht ein Entwurf, den du selbst abschickst.
erlaubt = []

[pruefung]
# Erst mit fünf echten Rechnungen trocken testen: `belege pruefung Rechnung.pdf`.
an = false
ordner = "Manuell prüfen"
regeln = ["empfaenger", "anschrift", "ust_id_lieferant", "rechnungsnummer", "datum", "steuer", "leistung"]
kleinbetrag = 250.0
entwurf_an_absender = true
# Absender oder Titel, die nie Rechnungen sind (Teilstrings, Groß-/Kleinschreibung egal).
# nie_beleg = ["SEO-Wochenreport", "report@meine-firma.de"]
# EU-USt-IdNr. des Lieferanten zusätzlich über VIES prüfen (30 Tage lokal gecacht).
ust_id_amtlich = false

[bericht]
# Leer = die Adresse des ersten Postfachs.
an = ""
leer_senden = false

[uebergabe]
# "mail" an eine Adresse (Steuerberater, DATEV Upload Mail, Lexware Office,
# sevDesk) oder "ordner" (ein freigegebener Ordner).
# Für DATEV/Steuerberater je Belegart getrennt (fehlende Art fällt auf adresse zurück):
# adressen = { eingang = "eingang@datev.example", ausgang = "ausgang@datev.example", sonstige = "" }
weg = "mail"
adresse = ""
ordner = ""
tag = 3
nur_pdf_tif = false
max_mb = 20
max_anhaenge = 50

[monat]
# Hier legst du die Kontoauszüge als CSV ab, ein Monat je Datei.
auszuege = "~/Belege/Kontoauszuege"

[takt]
minuten = 15
tag_uhrzeit = "21:00"
# Adresse deines Lebenszeichens (vom Kurs-Connector, Werkzeug lebenszeichen).
# Nach jedem fehlerfreien Takt meldet sich belege dort. Leer = aus.
lebenszeichen = ""

[update]
# Sonntags nach Verbesserungen schauen. Nur Updates ohne eigenen Schritt werden eingespielt.
automatisch = true
# Ohne Plus kommen automatische Updates vier Wochen ab Einrichtung, danach nur
# Sicherheitsupdates; von Hand geht es immer. Name des Zusatzpakets im Hinweis:
# plus_name = "Kassensturz"
# plus_link = "https://philipkleudgen.de/mitglieder/monatszahlen"

[urteil]
# claude = Claude-Abo (Standard) | codex = ChatGPT-Abo über Codex |
# lokal = Ollama nur auf diesem Mac | anthropic = Anthropic-API | ohne = nur Regeln
backend = "claude"
modell = "sonnet"
# modell_codex = "gpt-5.1-codex"
# modell_lokal = "qwen3:14b"

[dokumente]
# Verträge, Versicherungen und Briefe, die kein Beleg sind (Modul bh8).
eingang = "~/Belege/Dokumente-Eingang"
ordner = "Dokumente"
erinnern_tage = 28
# Verträge, Versicherungen und Briefe von Amt oder Bank, die per Mail, Handy,
# Scan oder in Downloads kommen, legt belege selbst unter Dokumente ab, wenn
# es sich sicher ist. Unsicheres bleibt wie bisher. false = nur von Hand.
automatisch = true
